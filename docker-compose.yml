services:
  postgres:
    build:
      context: ./infra/postgres
    image: propertyflow/postgis-pgvector:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propertyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}
      POSTGRES_DB: ${POSTGRES_DB:-propertyflow}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - propertyflow-internal

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - propertyflow-internal

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-PropertyFlow1!}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    expose:
      - "9200"
      - "9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - propertyflow-internal

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before deploying}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before deploying}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - propertyflow-internal

  migrate:
    build:
      context: .
      target: api-runtime
    image: propertyflow/api:production
    restart: "no"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-propertyflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}@postgres:5432/${POSTGRES_DB:-propertyflow}
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before deploying}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before deploying}
      S3_BUCKET: ${S3_BUCKET:-propertyflow-assets}
    command: ["node", "apps/api/dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - propertyflow-internal

  api:
    build:
      context: .
      target: api-runtime
    image: propertyflow/api:production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-propertyflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}@postgres:5432/${POSTGRES_DB:-propertyflow}
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before deploying}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before deploying}
      S3_BUCKET: ${S3_BUCKET:-propertyflow-assets}
      PROPERTYFLOW_ACCESS_TOKEN_SECRET: ${PROPERTYFLOW_ACCESS_TOKEN_SECRET:?Set PROPERTYFLOW_ACCESS_TOKEN_SECRET in .env before deploying}
      PROPERTYFLOW_ADMIN_KEY: ${PROPERTYFLOW_ADMIN_KEY:?Set PROPERTYFLOW_ADMIN_KEY in .env before deploying}
      PROPERTYFLOW_ALLOW_DEV_AUTH_HEADERS: "false"
      PROPERTYFLOW_BOOTSTRAP_LOGIN_CODE: ${PROPERTYFLOW_BOOTSTRAP_LOGIN_CODE:-}
      PROPERTYFLOW_BOOTSTRAP_USER_ID: ${PROPERTYFLOW_BOOTSTRAP_USER_ID:-manager-demo-1}
      PROPERTYFLOW_API_PUBLIC_URL: ${PROPERTYFLOW_API_PUBLIC_URL:-http://localhost:3001}
      AGENCY_APP_BASE_URL: ${AGENCY_APP_BASE_URL:-http://localhost:3002}
      PROPERTYFLOW_EMAIL_FROM: ${PROPERTYFLOW_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_ALLOW_DETERMINISTIC_CHAT_FALLBACK: ${AI_ALLOW_DETERMINISTIC_CHAT_FALLBACK:-false}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAP_GEOCODING_PROVIDER: ${MAP_GEOCODING_PROVIDER:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - propertyflow-internal
      - propertyflow-public

  worker:
    build:
      context: .
      target: worker-runtime
    image: propertyflow/worker:production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-propertyflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}@postgres:5432/${POSTGRES_DB:-propertyflow}
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env before deploying}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before deploying}
      S3_BUCKET: ${S3_BUCKET:-propertyflow-assets}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - propertyflow-internal

  web:
    build:
      context: .
      target: next-runtime
      args:
        APP_NAME: web
        APP_PORT: 3000
    image: propertyflow/web:production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PROPERTYFLOW_API_URL: http://api:3001
      NEXT_PUBLIC_PROPERTYFLOW_API_URL: ${NEXT_PUBLIC_PROPERTYFLOW_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_PROPERTYFLOW_WEB_URL: ${NEXT_PUBLIC_PROPERTYFLOW_WEB_URL:-http://localhost:3000}
      PROPERTYFLOW_TENANT_ID: ${PROPERTYFLOW_TENANT_ID:-demo-agency}
      PROPERTYFLOW_USER_ID: ${PROPERTYFLOW_USER_ID:-manager-demo-1}
      PROPERTYFLOW_USER_ROLE: ${PROPERTYFLOW_USER_ROLE:-manager}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - propertyflow-internal
      - propertyflow-public

  agency:
    build:
      context: .
      target: next-runtime
      args:
        APP_NAME: agency
        APP_PORT: 3002
    image: propertyflow/agency:production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      PROPERTYFLOW_API_URL: http://api:3001
      NEXT_PUBLIC_PROPERTYFLOW_API_URL: ${NEXT_PUBLIC_PROPERTYFLOW_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_PROPERTYFLOW_WEB_URL: ${NEXT_PUBLIC_PROPERTYFLOW_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_PROPERTYFLOW_WIDGET_SCRIPT_URL: ${NEXT_PUBLIC_PROPERTYFLOW_WIDGET_SCRIPT_URL:-http://localhost:3000/widget.js}
    ports:
      - "${AGENCY_PORT:-3002}:3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - propertyflow-internal
      - propertyflow-public

  admin:
    build:
      context: .
      target: next-runtime
      args:
        APP_NAME: admin
        APP_PORT: 3003
    image: propertyflow/admin:production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      PROPERTYFLOW_API_URL: http://api:3001
      NEXT_PUBLIC_PROPERTYFLOW_API_URL: ${NEXT_PUBLIC_PROPERTYFLOW_API_URL:-http://localhost:3001}
      PROPERTYFLOW_ADMIN_KEY: ${PROPERTYFLOW_ADMIN_KEY:?Set PROPERTYFLOW_ADMIN_KEY in .env before deploying}
    ports:
      - "${ADMIN_PORT:-3003}:3003"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - propertyflow-internal
      - propertyflow-public

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  minio-data:

networks:
  propertyflow-internal:
    internal: true
  propertyflow-public:
